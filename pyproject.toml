[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-parser"
version = "0.1.0"
description = "Core parsing engine for extracting structured data from scanned US tax form PDFs"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "openai>=1.30.0",
    "pdf2image>=1.16.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
